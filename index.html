<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Game Analytics</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #222;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

h1 {
    margin-bottom: 20px;
}

select {
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

.tabs button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.tabs button.active {
    font-weight: bold;
}

.card {
    background: white;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.session {
    cursor: pointer;
}

.session:hover {
    transform: translateY(-1px);
}

.activity {
    padding: 8px 0;
    border-bottom: 1px solid #eee;
}

.activity-status {
    padding: 8px 0;
    color: #777;
    font-style: italic;
}

.activity-status.error {
    color: #c0392b;
    font-style: normal;
}

.bar {
    height: 8px;
    background: #ddd;
    border-radius: 5px;
    overflow: hidden;
    margin-top: 5px;
}

.bar-inner {
    height: 100%;
    background: #555;
}

.hidden {
    display: none;
}

/* --- Reset feature --- */

.toolbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
}

.reset-btn {
    background: #c0392b;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.reset-btn:hover {
    background: #a5311f;
}

.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.modal.hidden {
    display: none;
}

.modal-content {
    background: white;
    padding: 24px;
    border-radius: 12px;
    max-width: 420px;
    width: 90%;
}

.modal-content h2 {
    margin-top: 0;
}

.modal-content label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 4px;
}

.modal-content select {
    margin-bottom: 16px;
}

.slider-container {
    margin: 24px 0 16px;
}

.slider-container input[type="range"] {
    width: 100%;
}

#sliderText {
    display: block;
    text-align: center;
    margin-top: 8px;
    color: #777;
    font-size: 14px;
}

#sliderText.ready {
    color: #c0392b;
    font-weight: bold;
}

.modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 10px;
}

.modal-buttons button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

#cancelReset {
    background: #eee;
}

#confirmReset {
    background: #c0392b;
    color: white;
}

#confirmReset:disabled {
    background: #ccc;
    color: #888;
    cursor: not-allowed;
}

</style>

</head>


<body>

<div class="container">

<h1>Game Analytics</h1>

<div class="toolbar">
    <button id="openResetModal" class="reset-btn">
        Reset Data
    </button>
</div>

<select id="gameSelect">
    <option value="all">Semua Game</option>
</select>


<div class="tabs">

<button id="activityTab"
        class="active"
        onclick="showTab('activity')">
    Activity List
</button>

<button id="statsTab"
        onclick="showTab('stats')">
    Statistics
</button>

</div>


<div id="activityPage"></div>

<div id="statsPage"
     class="hidden"></div>

</div>


<div id="resetModal" class="modal hidden">
    <div class="modal-content">

        <h2>Reset Semua Analytics?</h2>

        <p>
            Semua session, aktivitas, dan statistik akan dihapus.
            Tindakan ini tidak dapat dibatalkan.
        </p>

        <label for="resetGame">Game</label>
        <select id="resetGame">
            <option value="all">Semua Game</option>
        </select>

        <label for="resetType">Data yang direset</label>
        <select id="resetType">
            <option value="activities">Aktivitas</option>
            <option value="sessions">Session</option>
            <option value="all">Semua Data</option>
        </select>

        <div class="slider-container">
            <input
                type="range"
                id="resetSlider"
                min="0"
                max="100"
                value="0"
            >

            <span id="sliderText">
                Geser dari kiri ke kanan →
            </span>
        </div>

        <div class="modal-buttons">
            <button id="cancelReset">Batal</button>
            <button id="confirmReset" disabled>
                Reset
            </button>
        </div>

    </div>
</div>


<script>

const API =
    "https://game-analytics.akunffbya.workers.dev";


const gameSelect =
    document.getElementById("gameSelect");


const activityPage =
    document.getElementById("activityPage");


const statsPage =
    document.getElementById("statsPage");


let sessions = [];


async function loadGames() {

    try {

        const response =
            await fetch(API + "/games");

        const data =
            await response.json();

        for (const game of data.games) {

            const option =
                document.createElement("option");

            option.value = game;
            option.textContent = game;

            gameSelect.appendChild(option);
        }

    } catch (error) {
        console.error("Gagal memuat daftar game:", error);
    }
}


async function loadSessions() {

    const game =
        gameSelect.value;

    activityPage.innerHTML = `
        <div class="card">Loading sessions...</div>
    `;

    try {

        const response =
            await fetch(
                API +
                "/sessions?game=" +
                encodeURIComponent(game)
            );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status + " saat memuat sessions"
            );
        }

        const data =
            await response.json();

        sessions = data.sessions || [];

        activityPage.innerHTML = "";

        if (sessions.length === 0) {
            activityPage.innerHTML = `
                <div class="card">Tidak ada session.</div>
            `;
            return;
        }

        for (const session of sessions) {

            const card =
                document.createElement("div");

            card.className = "card session";

            card.innerHTML = `
                <strong>${escapeHtml(session.game_name)}</strong>
                <br>
                Session:
                ${escapeHtml(session.session_id)}
                <br>
                <small>${escapeHtml(session.created_at)}</small>
                <div class="activities">
                </div>
            `;

            card.onclick = () =>
                loadActivities(
                    session.session_id,
                    card
                );

            activityPage.appendChild(card);
        }

    } catch (error) {

        activityPage.innerHTML = `
            <div class="card">
                Gagal mengambil sessions: ${escapeHtml(error.message)}
            </div>
        `;

        console.error("Gagal memuat sessions:", error);
    }
}


async function loadActivities(
    sessionId,
    card
) {

    const container =
        card.querySelector(".activities");

    // Guard against re-fetching once activities have successfully loaded
    if (container.dataset.loaded === "true") {
        return;
    }

    container.innerHTML = `
        <div class="activity-status">Loading activities...</div>
    `;

    try {

        const response =
            await fetch(
                API +
                "/activities?session=" +
                sessionId
            );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status + " saat memuat activities"
            );
        }

        const data =
            await response.json();

        // Be defensive: accept a couple of plausible response shapes
        // in case the API nests the array differently than expected.
        const activities =
            data.activities ||
            (data.data && data.data.activities) ||
            (Array.isArray(data) ? data : null);

        if (!activities || activities.length === 0) {
            container.innerHTML = `
                <div class="activity-status">
                    Tidak ada aktivitas untuk session ini.
                </div>
            `;
            console.warn(
                "Respon /activities tidak berisi array 'activities' yang diharapkan:",
                data
            );
            return;
        }

        container.innerHTML = "";

        for (const item of activities) {

            const div =
                document.createElement("div");

            div.className = "activity";

            div.textContent =
                item.activity_order +
                ". " +
                item.activity;

            container.appendChild(div);
        }

        container.dataset.loaded = "true";

    } catch (error) {

        container.innerHTML = `
            <div class="activity-status error">
                Gagal mengambil activities: ${escapeHtml(error.message)}
                <br>
                <span style="text-decoration:underline;cursor:pointer"
                      onclick="event.stopPropagation(); this.closest('.activities').dataset.loaded=''; this.closest('.card').click();">
                    Coba lagi
                </span>
            </div>
        `;

        console.error(
            "Gagal memuat activities untuk session " + sessionId + ":",
            error
        );
    }
}


async function loadStatistics() {

    const game =
        gameSelect.value;

    statsPage.innerHTML = `
        <div class="card">
            <strong>
                Total Session:
            </strong>
            <span id="totalSessions">
                Loading...
            </span>
        </div>
    `;

    try {

        const response =
            await fetch(
                API +
                "/statistics?game=" +
                encodeURIComponent(game)
            );

        const data =
            await response.json();

        document.getElementById(
            "totalSessions"
        ).textContent = data.sessions;


        const positions =
            data.positions;


        for (const position of Object.keys(positions)) {

            const activities =
                positions[position];


            const card =
                document.createElement("div");

            card.className = "card";


            const title =
                document.createElement("h3");

            title.textContent =
                "Aktivitas ke-" + position;

            card.appendChild(title);


            for (const item of activities) {

                const wrapper =
                    document.createElement("div");

                wrapper.style.marginBottom =
                    "14px";


                const label =
                    document.createElement("div");

                label.innerHTML = `
                    <strong>
                        ${escapeHtml(item.activity)}
                    </strong>

                    <span style="float:right">
                        ${item.percentage}%
                        (${item.total} session)
                    </span>
                `;


                const bar =
                    document.createElement("div");

                bar.className = "bar";


                const barInner =
                    document.createElement("div");

                barInner.className =
                    "bar-inner";

                barInner.style.width =
                    Math.min(
                        item.percentage,
                        100
                    ) + "%";


                bar.appendChild(
                    barInner
                );

                wrapper.appendChild(label);
                wrapper.appendChild(bar);

                card.appendChild(wrapper);
            }


            statsPage.appendChild(card);
        }

    } catch (error) {

        statsPage.innerHTML = `
            <div class="card">
                Gagal mengambil statistics.
            </div>
        `;

        console.error(error);
    }
}

function showTab(tab) {

    if (tab === "activity") {

        activityPage.classList.remove("hidden");
        statsPage.classList.add("hidden");

        activityTab.classList.add("active");
        statsTab.classList.remove("active");

        loadSessions();

    } else {

        activityPage.classList.add("hidden");
        statsPage.classList.remove("hidden");

        activityTab.classList.remove("active");
        statsTab.classList.add("active");

        loadStatistics();
    }
}


gameSelect.onchange = () => {

    if (
        statsPage.classList.contains("hidden")
    ) {
        loadSessions();
    } else {
        loadStatistics();
    }
};


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* --- Reset feature --- */

const resetModal =
    document.getElementById("resetModal");

const openResetModalBtn =
    document.getElementById("openResetModal");

const cancelResetBtn =
    document.getElementById("cancelReset");

const confirmResetBtn =
    document.getElementById("confirmReset");

const resetSlider =
    document.getElementById("resetSlider");

const sliderText =
    document.getElementById("sliderText");

const resetGameSelect =
    document.getElementById("resetGame");

const resetTypeSelect =
    document.getElementById("resetType");


function syncResetGameOptions() {

    resetGameSelect.innerHTML =
        gameSelect.innerHTML;

    resetGameSelect.value =
        gameSelect.value;
}


function openResetModal() {

    syncResetGameOptions();

    resetSlider.value = 0;
    confirmResetBtn.disabled = true;
    sliderText.textContent = "Geser dari kiri ke kanan →";
    sliderText.classList.remove("ready");

    resetModal.classList.remove("hidden");
}


function closeResetModal() {
    resetModal.classList.add("hidden");
}


openResetModalBtn.onclick = openResetModal;

cancelResetBtn.onclick = closeResetModal;

resetModal.onclick = (event) => {
    if (event.target === resetModal) {
        closeResetModal();
    }
};


resetSlider.oninput = () => {

    const value =
        Number(resetSlider.value);

    if (value >= 100) {
        confirmResetBtn.disabled = false;
        sliderText.textContent = "✓ Siap untuk reset";
        sliderText.classList.add("ready");
    } else {
        confirmResetBtn.disabled = true;
        sliderText.textContent = "Geser dari kiri ke kanan →";
        sliderText.classList.remove("ready");
    }
};


confirmResetBtn.onclick = async () => {

    const game =
        document.getElementById("resetGame").value;

    const type =
        document.getElementById("resetType").value;

    confirmResetBtn.disabled = true;
    confirmResetBtn.textContent = "Mereset...";

    try {

        const response =
            await fetch(`${API}/reset`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    game: game,
                    type: type
                })
            });

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status + " saat mereset data"
            );
        }

        closeResetModal();

        // Refresh whichever tab is currently visible
        if (statsPage.classList.contains("hidden")) {
            loadSessions();
        } else {
            loadStatistics();
        }

    } catch (error) {

        alert(
            "Gagal mereset data: " + error.message
        );

        console.error("Gagal mereset data:", error);

    } finally {

        confirmResetBtn.textContent = "Reset";
        confirmResetBtn.disabled = true;
        resetSlider.value = 0;
        sliderText.textContent = "Geser dari kiri ke kanan →";
        sliderText.classList.remove("ready");
    }
};


loadGames();
loadSessions();

</script>

</body>

</html>
